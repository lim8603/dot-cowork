name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release (e.g., 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Configure git identity (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}".Trim()
          $ver = $ver -replace '^v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Invalid version '$ver'. Expected MAJOR.MINOR.PATCH (e.g., 1.0.0)."
            exit 1
          }
          $tag = "v$ver"
          git fetch --force --tags
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"

          if ($remoteTag) {
            Write-Host "Tag $tag already exists on origin. Reusing the tagged commit."
            git checkout $tag
          } else {
            git tag -a $tag -m "release: $tag"
            git push origin "refs/tags/$tag"
          }

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^v', ''
          }
          Write-Host "Version: $ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify release metadata and build archive
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          ./scripts/release.ps1 verify -Version $ver -Build

      - name: Verify zip assets
        shell: pwsh
        run: |
          $assets = @(
            'dist/cowork-context-framework-kr.zip',
            'dist/cowork-context-framework-en.zip'
          )

          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { Write-Error "Missing: $asset"; exit 1 }
            Write-Host ("{0}: {1} bytes" -f $asset, (Get-Item $asset).Length)
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            dist/cowork-context-framework-kr.zip
            dist/cowork-context-framework-en.zip
          generate_release_notes: true
